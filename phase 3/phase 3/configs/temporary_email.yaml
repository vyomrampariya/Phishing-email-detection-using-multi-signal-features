# Initial engineering defaults, not empirically optimized. Scores are risk-oriented [0,1].
model_version: "3.0.0"
weights:
  DB: 0.45
  SC: 0.20
  DA: 0.15
  DC: 0.20
normalize_weights: false
subdomain_matching: false
source_freshness_days: 90
source_trust:
  disposable-email-domains: 1.0
known_provider_rules:
  disposable:
    - mailinator.com
    - 10minutemail.com
    - guerrillamail.com
  ordinary:
    - gmail.com
    - googlemail.com
    - outlook.com
    - hotmail.com
    - yahoo.com
    - icloud.com
    - proton.me
    - protonmail.com
organization_domains: []
age_risk_days:
  - max_age_days: 7
    score: 0.9
  - max_age_days: 30
    score: 0.7
  - max_age_days: 180
    score: 0.4
  - max_age_days: 365
    score: 0.2
  - max_age_days: null
    score: 0.0
