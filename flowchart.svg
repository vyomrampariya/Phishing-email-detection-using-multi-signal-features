<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d"><title id="t">VYOM phishing assessment flow</title><desc id="d">Single email or dataset input feeds six scored phases and an additional-features check; adaptive weighted fusion produces Safe, Suspicious, Phishy or Human Review.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#526579"/></marker></defs>
<rect width="1200" height="860" fill="#f5f8fc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172b4d" stroke="#526579" stroke-width="2">
<text x="600" y="40" stroke="none" font-size="26" font-weight="bold">VYOM · Phishing assessment flow</text>
<rect x="230" y="60" width="740" height="50" rx="12" fill="#e4efff"/><text x="600.0" y="91.0" stroke="none" font-size="16" font-weight="bold">1 · Input: single email (.eml / paste) or email dataset (.csv .json .jsonl .mbox, folder)</text>
<rect x="40" y="140" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="173.0" stroke="none" font-size="16" font-weight="bold">2 · Email text processing · 0.25</text>
<text x="320.0" y="191.0" stroke="none" font-size="12">lowercase · punctuation · tokens · stop words · lemmas · n-grams · collocations · TF-IDF · rare · CTA</text>
<line x1="600" y1="175" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="230" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="263.0" stroke="none" font-size="16" font-weight="bold">3 · Sender &amp; header · 0.15</text>
<text x="320.0" y="281.0" stroke="none" font-size="12">reputation · From/Reply-To mismatch (0/1) · SPF/DKIM/DMARC · display-name spoof · similarity</text>
<line x1="600" y1="265" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="320" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="353.0" stroke="none" font-size="16" font-weight="bold">4 · Temporary email · 0.10</text>
<text x="320.0" y="371.0" stroke="none" font-size="12">disposable DB (From + Reply-To) · sender category · domain age (RDAP) · reputation</text>
<line x1="600" y1="355" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="410" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="443.0" stroke="none" font-size="16" font-weight="bold">5 · URL analysis · 0.20</text>
<text x="320.0" y="461.0" stroke="none" font-size="12">extract · normalize · length/depth/hyphens · IP · entropy · punycode · look-alike · redirects</text>
<line x1="600" y1="445" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="500" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="533.0" stroke="none" font-size="16" font-weight="bold">6 · Website intelligence · 0.20</text>
<text x="320.0" y="551.0" stroke="none" font-size="12">domain/RDAP · brand &amp; logo · urgent wording &amp; CTA · login/payment forms (retrieval opt-in)</text>
<line x1="600" y1="535" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="590" width="560" height="70" rx="12" fill="white"/><text x="320.0" y="623.0" stroke="none" font-size="16" font-weight="bold">Attachment metadata · 0.10</text>
<text x="320.0" y="641.0" stroke="none" font-size="12">filename · MIME · size (never opened)</text>
<line x1="600" y1="625" x2="690" y2="430" marker-end="url(#a)"/>
<rect x="40" y="680" width="560" height="70" rx="12" fill="#fff4e0"/><text x="320.0" y="713.0" stroke="none" font-size="16" font-weight="bold">7 · Additional features (bounded boost ≤ +0.12)</text>
<text x="320.0" y="731.0" stroke="none" font-size="12">evidence consistency (same intent?) · thread / cross-email analysis</text>
<line x1="600" y1="715" x2="690" y2="430" marker-end="url(#a)"/>
<line x1="600" y1="110" x2="320" y2="138" marker-end="url(#a)"/>
<rect x="690" y="380" width="200" height="100" rx="12" fill="#e4efff"/><text x="790.0" y="428.0" stroke="none" font-size="16" font-weight="bold">8 · Adaptive fusion</text>
<text x="790.0" y="446.0" stroke="none" font-size="12">S_raw = Σ αᵢ·Sᵢ</text>
<text x="790" y="500" stroke="none" font-size="12">missing phases excluded, weights renormalized</text>
<text x="790" y="516" stroke="none" font-size="12">coverage &lt; 0.30 → Human Review</text>
<rect x="960" y="250" width="200" height="70" rx="12" fill="#dff5e3"/><text x="1060.0" y="283.0" stroke="none" font-size="16" font-weight="bold">Safe</text>
<text x="1060.0" y="301.0" stroke="none" font-size="12">0.00 ≤ P &lt; 0.30</text>
<line x1="890" y1="430" x2="960" y2="285" marker-end="url(#a)"/>
<rect x="960" y="360" width="200" height="70" rx="12" fill="#fff1c9"/><text x="1060.0" y="393.0" stroke="none" font-size="16" font-weight="bold">Suspicious</text>
<text x="1060.0" y="411.0" stroke="none" font-size="12">0.30 ≤ P &lt; 0.60</text>
<line x1="890" y1="430" x2="960" y2="395" marker-end="url(#a)"/>
<rect x="960" y="470" width="200" height="70" rx="12" fill="#fbd9d6"/><text x="1060.0" y="503.0" stroke="none" font-size="16" font-weight="bold">Phishy</text>
<text x="1060.0" y="521.0" stroke="none" font-size="12">0.60 ≤ P ≤ 1.00</text>
<line x1="890" y1="430" x2="960" y2="505" marker-end="url(#a)"/>
<rect x="960" y="580" width="200" height="70" rx="12" fill="#e9e3f7"/><text x="1060.0" y="613.0" stroke="none" font-size="16" font-weight="bold">Human Review</text>
<text x="1060.0" y="631.0" stroke="none" font-size="12">insufficient evidence</text>
<line x1="890" y1="430" x2="960" y2="615" marker-end="url(#a)"/>
</g></svg>