model_version: phase2-rules-0.1.0
weights:
  W1: 0.15 # Rep
  W2: 0.15 # Mismatch
  W3: 0.15 # Anomaly
  W4: 0.20 # Auth
  W5: 0.20 # Spoof
  W6: 0.15 # Similarity
missing_data_policy: renormalize_available_weights_if_coverage_at_least_0.50_else_incomplete
protected_domains: []
reputation_provider:
  enabled: false
  timeout_seconds: 2
  cache_ttl_seconds: 3600
  rate_limit_per_minute: 30
  note: No external queries are performed by this implementation.
authentication:
  trust_authentication_results_by_default: false
  statuses: [PASS, FAIL, SOFTFAIL, NEUTRAL, NONE, TEMPERROR, PERMERROR, UNKNOWN, UNAVAILABLE]
